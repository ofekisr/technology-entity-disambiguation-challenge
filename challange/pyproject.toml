[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-resolver"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "rapidfuzz>=3.6", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[project.scripts]
idx = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["data/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["bank(node): case from ex.mmap › Brainstorm > V2 > 7. Test-case bank"]
